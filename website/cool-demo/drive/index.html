<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Take the wheel or let AI choose its own path. An interactive driving playground powered by the Simple Jev classifier API."
    />
    <title>Simple Jev Pilot — Play the driving demo</title>
    <link
      rel="icon"
      type="image/png"
      href="../../assets/simple-jev.png"
    />
    <style>#scene-loader{z-index:1000;color:#171a20;text-align:center;background:#f5f6f8;place-content:center;justify-items:center;gap:16px;padding:24px;font:14px system-ui,sans-serif;display:grid;position:fixed;inset:64px 0 0}#scene-loader[hidden],#scene-loader [hidden]{display:none}#scene-loader img{width:40px;height:40px}#scene-loader strong{font-size:20px;font-weight:600}#scene-loader p{color:#737985;margin:0}.loading-spinner{border:2px solid #dfe2e6;border-top-color:#171a20;border-radius:50%;width:22px;height:22px;animation:.9s linear infinite loading-spin}#loading-retry{color:#fff;cursor:pointer;background:#171a20;border:0;border-radius:8px;padding:12px 18px}@keyframes loading-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.loading-spinner{animation:none}}</style>
    <script src="../../shared/demo-header.js" defer></script>
    <script type="module" crossorigin src="./assets/index-CAduu3ti.js"></script>
  </head>
  <body class="loading">
    <simple-jev-demo-header></simple-jev-demo-header>
    <div id="scene-loader" role="status" aria-live="polite">
      <img src="../../assets/simple-jev.png" alt="" />
      <strong>Getting your drive ready</strong>
      <p id="loading-message">Loading JevPilot…</p>
      <span class="loading-spinner" aria-hidden="true"></span>
      <button id="loading-retry" hidden>Try again</button>
    </div>
    <div id="app" inert aria-busy="true"></div>
  </body>
</html>
